<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(50,50)" fill="#CC785C">
    <!-- 12 rays at 30° intervals, rotated to match Claude's logo -->
    <ellipse rx="7" ry="28" transform="rotate(0)"/>
    <ellipse rx="7" ry="28" transform="rotate(30)"/>
    <ellipse rx="7" ry="28" transform="rotate(60)"/>
    <ellipse rx="7" ry="28" transform="rotate(90)"/>
    <ellipse rx="7" ry="28" transform="rotate(120)"/>
    <ellipse rx="7" ry="28" transform="rotate(150)"/>
  </g>
</svg>